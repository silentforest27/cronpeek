[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronpeek"
version = "0.1.0"
description = "Dependency-free cron expression parser and scheduler"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
cronpeek = "cronpeek.cli:main"

[tool.setuptools.packages.find]
where = ["."]
